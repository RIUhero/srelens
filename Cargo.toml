[workspace]
resolver = "2"
members = ["crates/agent", "crates/capability", "crates/mcp", "crates/kube", "crates/streams", "crates/server", "crates/registry", "crates/llm", "crates/mydashboard-core", "apps/desktop/src-tauri"]
exclude = [
    "third_party/openidconnect-rs",
    "third_party/sqlx-sqlite-only/sqlx",
    "third_party/sqlx-sqlite-only/sqlx-macros-core",
]

[patch.crates-io]
openidconnect = { path = "third_party/openidconnect-rs" }
sqlx = { path = "third_party/sqlx-sqlite-only/sqlx" }
sqlx-macros-core = { path = "third_party/sqlx-sqlite-only/sqlx-macros-core" }

[workspace.package]
edition = "2021"
version = "0.7.2"
license = "MIT"

# Fast-feedback profile for the CI WebDriver smoke job (issue #30): dev
# semantics, but no debuginfo — its generation and linking dominate the
# app-binary build time there, and the smoke suite never reads symbols.
[profile.ci-smoke]
inherits = "dev"
debug = 0
strip = "debuginfo"
